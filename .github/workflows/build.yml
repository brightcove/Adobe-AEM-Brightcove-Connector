# Compile-level parity guard (ONPREM-PARITY-PLAN.md §3 Phase 1, step 4).
#
# Builds both the cloud and on-prem artifacts from the same unified source
# tree on every push/PR, so a change that breaks one platform's compile is
# caught immediately rather than at the next manual on-prem build. This does
# NOT run against a live AEM instance: no deploy, no bundle/content checks,
# no e2e execution. It does run the core module's unit tests per platform. Those still require `tests/e2e/pre-qa-gate.sh` against a
# local AEM author before a ticket goes to Ready for QA.
#
# ⚠️ The org requires every action to be pinned to a full-length commit SHA
# (a bare `@v4` fails at job setup with "all actions must be pinned"). Keep the
# `# vX.Y.Z` comment next to each pin so bumps stay reviewable.
name: Build

on:
  push:
    branches:
      - cloud-master
      - main
      - 'release/**'
      - 'feat/**'
  pull_request:

jobs:
  build:
    name: build (${{ matrix.platform }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [cloud, onprem]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Two JDKs: the LAST listed is the default JAVA_HOME (the build stays on 11),
      # the other is exposed as JAVA_HOME_21_X64 for the Java 21 unit-test run below.
      - name: Set up JDK 21 and 11
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: |
            21
            11
          cache: maven

      # Unit tests first, per platform: the core module compiles against a
      # different platform API in each profile, so both runs are meaningful.
      # Until 2026-09-18 this workflow only compiled (-DskipTests) and listed
      # the Playwright specs, so no test of any kind ran in CI.
      - name: Unit tests (cloud, default profile)
        if: matrix.platform == 'cloud'
        working-directory: current
        run: mvn -pl core test

      - name: Unit tests (onprem profile)
        if: matrix.platform == 'onprem'
        working-directory: current
        run: mvn -Daem.platform=onprem -pl core test

      # Same tests, forked onto a Java 21 JVM (surefire -Djvm), build JDK still 11.
      # HttpServicesPatchFallbackTest asserts the JVM-dependent PATCH behaviour, so
      # this is the run that measures the 17+ branch (BGS-1600). The last step proves
      # which JVM the tests actually ran on, read from the surefire XML, and FAILS the
      # job when it is not 21 (or the XML is missing): without that, dropping -Djvm
      # leaves the run green on the build JVM.
      - name: Unit tests on Java 21 (${{ matrix.platform }})
        working-directory: current
        run: |
          set -o pipefail
          JAVA21="$JAVA_HOME_21_X64/bin/java"
          "$JAVA21" -version
          if [ "${{ matrix.platform }}" = onprem ]; then PROFILE=-Daem.platform=onprem; else PROFILE=; fi
          mvn $PROFILE -pl core test -Djvm="$JAVA21"
          XML=core/target/surefire-reports/TEST-com.coresecure.brightcove.wrapper.utils.HttpServicesPatchFallbackTest.xml
          if ! grep -q 'name="java.version" value="21\.' "$XML"; then
            echo "::error::HttpServicesPatchFallbackTest did not run on Java 21 (or $XML is missing)"
            grep -o 'name="java.version" value="[^"]*"' "$XML" || true
            exit 1
          fi
          echo "surefire ran HttpServicesPatchFallbackTest on Java 21"

      - name: Build (cloud, default profile)
        if: matrix.platform == 'cloud'
        working-directory: current
        run: mvn clean package -DskipTests

      - name: Build (onprem profile)
        if: matrix.platform == 'onprem'
        working-directory: current
        run: mvn -Daem.platform=onprem clean package -DskipTests

      - name: List package contents
        working-directory: current/all/target
        run: |
          zip_file=$(ls brightcove.all-*.zip)
          echo "Built: $zip_file"
          unzip -l "$zip_file"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: brightcove-all-${{ matrix.platform }}
          path: current/all/target/brightcove.all-*.zip
          if-no-files-found: error

  # Runs after BOTH platform builds: the script reads both zips and fails on any FAIL line.
  packaging-check:
    name: DAM sync packaging check
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Download cloud package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: brightcove-all-cloud
          path: pkg/cloud

      - name: Download on-prem package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: brightcove-all-onprem
          path: pkg/onprem

      # The platform is read from the file name ("-prem.zip" is on-prem), so the on-prem
      # artifact must keep that suffix. See docs/dam-sync-on-activation.md.
      - name: Check packaging defaults of both artifacts
        run: |
          set -o pipefail
          ls pkg/cloud pkg/onprem
          python3 -I current/scripts/check-dam-sync-packaging.py pkg/cloud/brightcove.all-*.zip pkg/onprem/brightcove.all-*-prem.zip

  e2e-static:
    name: e2e spec syntax check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install e2e deps
        working-directory: tests/e2e
        run: npm ci

      - name: List specs (syntax check only; no browser, no AEM instance)
        working-directory: tests/e2e
        run: npx playwright test --list
